<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Breathing Space - Modern Minimal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fafafa; /* 白に近いグレー */
            --text-color: #222222; /* 深い墨色 */
            --catcher-pos-bottom: 120px; /* 線の位置 */
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh; 
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Shippori Mincho', serif;
            user-select: none; touch-action: none;
        }

        /* --- 文字が消えるマスク設定 --- */
        #rain-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 5; 
            /* 線の位置から下にかけて透明にするマスク */
            -webkit-mask-image: linear-gradient(to bottom, 
                black 0%, 
                black calc(100% - var(--catcher-pos-bottom)), 
                transparent calc(100% - var(--catcher-pos-bottom) + 50px));
            mask-image: linear-gradient(to bottom, 
                black 0%, 
                black calc(100% - var(--catcher-pos-bottom)), 
                transparent calc(100% - var(--catcher-pos-bottom) + 50px));
        }

        .rain-char { 
            position: absolute; font-size: 18px; 
            color: var(--text-color); /* 文字も濃い色に */
            opacity: 0.8;
        }

        /* --- 器：ただの一本の線 --- */
        #catcher {
            position: absolute; 
            bottom: var(--catcher-pos-bottom); 
            left: 50%;
            transform: translateX(-50%); 
            width: 80px; /* 線を短めにしてモダンに */
            height: 1px; 
            background: var(--text-color); /* 器も線のみ */
            z-index: 10;
        }

        #caught-text { 
            position: absolute; top: -50px; width: 100%; text-align: center; 
            font-size: 24px; font-weight: 700; opacity: 0; transition: opacity 0.3s; 
        }
        #caught-text.active { opacity: 1; }

        #guide { 
            position: absolute; top: 40%; width: 100%; text-align: center; 
            color: rgba(0,0,0,0.2); font-size: 13px; letter-spacing: 0.5em; 
        }

        /* --- 結果表示 --- */
        #result-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: none; 
            flex-direction: column; justify-content: center; align-items: center;
            background: var(--bg-color); padding: 20px; box-sizing: border-box;
        }

        #result-wrapper {
            display: flex; justify-content: center; width: 100%; height: 70dvh;
        }

        #result-container {
            writing-mode: vertical-rl; text-orientation: upright;
            height: 100%; max-width: 90vw;
            font-size: 18px; line-height: 2.5; letter-spacing: 0.3em;
            display: block;
        }

        .res-char { display: inline-block; opacity: 0; transition: opacity 2.5s ease-in-out; }

        #footer-info {
            margin-top: 30px; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            opacity: 0; transition: opacity 2s ease;
        }

        #score { font-size: 12px; color: #999; letter-spacing: 0.1em; }
        
        #btn-back { 
            padding: 10px 40px; font-size: 12px; border: 1px solid #ccc; 
            background: transparent; color: #666; cursor: pointer;
            font-family: 'Shippori Mincho', serif; transition: 0.3s;
        }
        #btn-back:active { border-color: #222; color: #222; }
    </style>
</head>
<body>

    <div id="rain-container"></div>
    <div id="guide">言葉を掬い取る</div>
    <div id="catcher"><div id="caught-text"></div></div>

    <div id="result-layer">
        <div id="result-wrapper">
            <div id="result-container"></div>
        </div>
        <div id="footer-info">
            <div id="score"></div>
            <button id="btn-back" onclick="location.reload()">目次へ戻る</button>
        </div>
    </div>

    <script>
        const textSource = "雨ニモマケズ風ニモマケズ雪ニモ夏ノ暑サニモマケヌ丈夫ナカラダヲモチ慾ハナク決シテ瞋ラズイツモシヅカニワラッテヰル";
        
        const rainContainer = document.getElementById('rain-container');
        const catcher = document.getElementById('catcher');
        const caughtTextDisplay = document.getElementById('caught-text');
        const resultLayer = document.getElementById('result-layer');
        const resultContainer = document.getElementById('result-container');
        const scoreDisplay = document.getElementById('score');
        const footerInfo = document.getElementById('footer-info');

        let charIndex = 0;
        let fallingChars = [];
        let gameActive = false;
        let isFinished = false;
        let caughtIndices = new Set();

        function init() {
            const start = () => { if (!gameActive && !isFinished) { gameActive = true; document.getElementById('guide').style.opacity = 0; } };
            window.addEventListener('mousemove', (e) => updateCatcherPos(e.clientX));
            window.addEventListener('touchstart', (e) => { start(); updateCatcherPos(e.touches[0].clientX); }, { passive: false });
            window.addEventListener('touchmove', (e) => { e.preventDefault(); updateCatcherPos(e.touches[0].clientX); }, { passive: false });
            loop();
        }

        function updateCatcherPos(x) {
            let cx = Math.max(40, Math.min(window.innerWidth - 40, x));
            catcher.style.left = cx + 'px';
        }

        function spawnChar() {
            if (charIndex >= textSource.length) return; 
            const char = textSource[charIndex];
            const el = document.createElement('div');
            el.textContent = char; el.classList.add('rain-char');
            const x = Math.random() * (window.innerWidth - 40) + 20;
            rainContainer.appendChild(el);
            fallingChars.push({ el, char, index: charIndex, x, y: -30, speed: 1.5 + Math.random() * 2 });
            charIndex++;
        }

        function loop() {
            if (isFinished) return;
            requestAnimationFrame(loop);
            if (gameActive && charIndex >= textSource.length && fallingChars.length === 0) {
                setTimeout(finishGame, 1200); return;
            }
            if (!gameActive) return;
            if (Math.random() < 0.03) spawnChar(); // 落下頻度を少し下げてゆったりと

            const cr = catcher.getBoundingClientRect();
            for (let i = fallingChars.length - 1; i >= 0; i--) {
                const p = fallingChars[i];
                p.y += p.speed;
                p.el.style.top = p.y + 'px'; p.el.style.left = p.x + 'px';

                // 掬い取る判定（線の付近を通過したか）
                if (p.y >= cr.top - 10 && p.y <= cr.top + 10 && p.x >= cr.left - 40 && p.x <= cr.right + 40) {
                    caughtIndices.add(p.index);
                    caughtTextDisplay.textContent = p.char;
                    caughtTextDisplay.classList.add('active');
                    setTimeout(() => caughtTextDisplay.classList.remove('active'), 400);
                    p.el.remove(); fallingChars.splice(i, 1);
                } else if (p.y > window.innerHeight) {
                    p.el.remove(); fallingChars.splice(i, 1);
                }
            }
        }

        function finishGame() {
            isFinished = true;
            resultLayer.style.display = 'flex';
            resultContainer.innerHTML = '';
            
            const interval = 280; // 1文字出す間隔をさらにゆっくりに

            for (let i = 0; i < textSource.length; i++) {
                const span = document.createElement('span');
                span.textContent = caughtIndices.has(i) ? textSource[i] : "　";
                span.classList.add('res-char');
                resultContainer.appendChild(span);
                
                setTimeout(() => {
                    span.style.opacity = '1';
                }, i * interval);
            }

            scoreDisplay.textContent = `${caughtIndices.size} / ${textSource.length} 文字を収集`;

            setTimeout(() => {
                footerInfo.style.opacity = '1';
            }, textSource.length * interval + 1000);
        }

        init();
    </script>
</body>
</html>
