<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Breathing Space - Vertical Fixed</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-top: #4b5563;
            --bg-bottom: #e5e7eb;
            --text-main: #1f2937;
            --catcher-pos-bottom: 100px;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh; 
            overflow: hidden;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 90%);
            color: var(--text-main);
            font-family: 'Shippori Mincho', serif;
            user-select: none; touch-action: none;
        }

        /* ゲーム中の雨 */
        #rain-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .rain-char { position: absolute; font-size: 18px; color: #ffffff; }

        /* 器 */
        #catcher {
            position: absolute; bottom: var(--catcher-pos-bottom); left: 50%;
            transform: translateX(-50%); width: 120px; height: 35px;
            border: 1px solid var(--text-main); border-top: none;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(2px); z-index: 10;
        }

        #caught-text { position: absolute; top: -40px; width: 100%; text-align: center; font-size: 20px; opacity: 0; transition: opacity 0.3s; }
        #caught-text.active { opacity: 1; }

        #guide { position: absolute; top: 40%; width: 100%; text-align: center; color: rgba(255,255,255,0.4); font-size: 13px; letter-spacing: 0.4em; }

        /* --- 結果表示：はみ出し対策済 --- */
        #result-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: none; 
            flex-direction: column; justify-content: center; align-items: center;
            background: var(--bg-bottom); padding: 20px; box-sizing: border-box;
        }

        #result-wrapper {
            /* 縦書きの文字を中央に固定するためのラッパー */
            display: flex; justify-content: center; width: 100%; height: 75dvh;
        }

        #result-container {
            writing-mode: vertical-rl;
            text-orientation: upright;
            height: 100%; /* 親要素の75vhいっぱいに使う */
            max-width: 90vw;
            font-size: 18px; /* スマホで1行に多く収まるサイズ */
            line-height: 2.2; /* 行間（列の間隔） */
            letter-spacing: 0.25em; /* 文字間 */
            display: block; /* flexを解除して純粋な縦書きフローにする */
        }

        .res-char {
            display: inline-block;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        #footer-info {
            margin-top: 20px; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            opacity: 0; transition: opacity 1.5s ease;
        }

        #score { font-size: 13px; color: #666; }
        #btn-back { padding: 10px 30px; font-size: 12px; border: 1px solid var(--text-main); background: transparent; font-family: 'Shippori Mincho', serif; }
    </style>
</head>
<body>

    <div id="rain-container"></div>
    <div id="guide">言葉を掬い取る</div>
    <div id="catcher"><div id="caught-text"></div></div>

    <div id="result-layer">
        <div id="result-wrapper">
            <div id="result-container"></div>
        </div>
        <div id="footer-info">
            <div id="score"></div>
            <button id="btn-back" onclick="location.reload()">目次へ戻る</button>
        </div>
    </div>

    <script>
        const textSource = "雨ニモマケズ風ニモマケズ雪ニモ夏ノ暑サニモマケヌ丈夫ナカラダヲモチ慾ハナク決シテ瞋ラズイツモシヅカニワラッテヰル";
        
        const rainContainer = document.getElementById('rain-container');
        const catcher = document.getElementById('catcher');
        const caughtTextDisplay = document.getElementById('caught-text');
        const resultLayer = document.getElementById('result-layer');
        const resultContainer = document.getElementById('result-container');
        const scoreDisplay = document.getElementById('score');
        const footerInfo = document.getElementById('footer-info');

        let charIndex = 0;
        let fallingChars = [];
        let gameActive = false;
        let isFinished = false;
        let caughtIndices = new Set();

        function init() {
            const start = () => { if (!gameActive && !isFinished) { gameActive = true; document.getElementById('guide').style.opacity = 0; } };
            window.addEventListener('mousemove', (e) => updateCatcherPos(e.clientX));
            window.addEventListener('touchstart', (e) => { start(); updateCatcherPos(e.touches[0].clientX); }, { passive: false });
            window.addEventListener('touchmove', (e) => { e.preventDefault(); updateCatcherPos(e.touches[0].clientX); }, { passive: false });
            loop();
        }

        function updateCatcherPos(x) {
            let cx = Math.max(60, Math.min(window.innerWidth - 60, x));
            catcher.style.left = cx + 'px';
        }

        function spawnChar() {
            if (charIndex >= textSource.length) return; 
            const char = textSource[charIndex];
            const el = document.createElement('div');
            el.textContent = char; el.classList.add('rain-char');
            const x = Math.random() * (window.innerWidth - 40) + 20;
            rainContainer.appendChild(el);
            fallingChars.push({ el, char, index: charIndex, x, y: -30, speed: 2 + Math.random() * 2 });
            charIndex++;
        }

        function loop() {
            if (isFinished) return;
            requestAnimationFrame(loop);
            if (gameActive && charIndex >= textSource.length && fallingChars.length === 0) {
                setTimeout(finishGame, 1000); return;
            }
            if (!gameActive) return;
            if (Math.random() < 0.04) spawnChar();

            const cr = catcher.getBoundingClientRect();
            for (let i = fallingChars.length - 1; i >= 0; i--) {
                const p = fallingChars[i];
                p.y += p.speed;
                p.el.style.top = p.y + 'px'; p.el.style.left = p.x + 'px';

                if (p.y >= cr.top && p.y <= cr.bottom && p.x >= cr.left && p.x <= cr.right) {
                    caughtIndices.add(p.index);
                    caughtTextDisplay.textContent = p.char;
                    caughtTextDisplay.classList.add('active');
                    setTimeout(() => caughtTextDisplay.classList.remove('active'), 300);
                    p.el.remove(); fallingChars.splice(i, 1);
                } else if (p.y > window.innerHeight) {
                    p.el.remove(); fallingChars.splice(i, 1);
                }
            }
        }

        function finishGame() {
            isFinished = true;
            resultLayer.style.display = 'flex';
            resultContainer.innerHTML = '';
            
            // 出現スピードをさらにゆったり（250ms間隔）
            const interval = 250; 

            for (let i = 0; i < textSource.length; i++) {
                const span = document.createElement('span');
                span.textContent = caughtIndices.has(i) ? textSource[i] : "　";
                span.classList.add('res-char');
                resultContainer.appendChild(span);
                
                setTimeout(() => {
                    span.style.opacity = '1';
                }, i * interval);
            }

            // スコア表示：〇〇 / 56 文字を収集
            scoreDisplay.textContent = `${caughtIndices.size} / ${textSource.length} 文字を収集`;

            setTimeout(() => {
                footerInfo.style.opacity = '1';
            }, textSource.length * interval + 1000);
        }

        init();
    </script>
</body>
</html>
