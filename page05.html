<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Breathing Space - Modern Minimal Stages</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fafafa;
            --text-color: #222222;
            --catcher-pos-bottom: 140px;
            --line-width: 80px;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh; 
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Shippori Mincho', serif;
            user-select: none; touch-action: none;
        }

        #rain-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 5; 
            -webkit-mask-image: linear-gradient(to bottom, 
                black 0%, 
                black calc(100% - var(--catcher-pos-bottom)), 
                transparent calc(100% - var(--catcher-pos-bottom) + 60px));
            mask-image: linear-gradient(to bottom, 
                black 0%, 
                black calc(100% - var(--catcher-pos-bottom)), 
                transparent calc(100% - var(--catcher-pos-bottom) + 60px));
        }

        .rain-char { 
            position: absolute; 
            top: 0; left: 0; 
            font-size: 18px; 
            color: var(--text-color);
            opacity: 0.7;
            will-change: transform;
        }

        #catcher {
            position: absolute; 
            bottom: var(--catcher-pos-bottom); 
            left: 50%;
            transform: translateX(-50%); 
            width: var(--line-width); 
            height: 1px; 
            background: var(--text-color); 
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #caught-text { 
            position: absolute; 
            bottom: 20px; 
            width: 100%; 
            text-align: center; 
            font-size: 24px; 
            font-weight: 700; 
            opacity: 0; 
            transition: opacity 0.3s, transform 0.4s ease-out;
            transform: translateY(10px);
        }
        #caught-text.active { 
            opacity: 1; 
            transform: translateY(0);
        }

        #guide { 
            position: absolute; top: 45%; width: 100%; text-align: center; 
            color: rgba(0,0,0,0.15); font-size: 12px; letter-spacing: 0.6em; 
            transition: opacity 0.5s;
        }

        /* --- 結果表示 --- */
        #result-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: none; 
            flex-direction: column; justify-content: center; align-items: center;
            background: var(--bg-color); padding: 20px; box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.8s ease-in;
        }

        #result-wrapper {
            display: flex; justify-content: center; width: 100%; height: 60dvh;
            overflow: hidden;
        }

        #result-container {
            writing-mode: vertical-rl; 
            text-orientation: upright;
            height: 100%; 
            max-width: 90vw;
            font-size: clamp(16px, 3.2vh, 20px); 
            line-height: 2.2; 
            letter-spacing: 0.35em;
            display: block;
        }

        .res-char { 
            display: inline-block; 
            opacity: 0; 
            visibility: hidden; 
            transition: opacity 4s ease; 
            will-change: opacity;
        }

        #footer-info {
            margin-top: 30px; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            opacity: 0; transition: opacity 1.5s ease;
        }

        /* --- 「次へ進む」ボタン --- */
        .btn-action { 
            padding: 12px 45px; 
            font-size: 11px; 
            border: 1px solid #ddd; 
            background-color: #ffffff;
            color: #555; 
            cursor: pointer;
            letter-spacing: 0.2em;
            font-family: 'Shippori Mincho', serif; 
            transition: all 0.15s ease-out;
            margin: 5px;
            box-shadow: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-action:active { 
            transform: scale(0.93); 
            background-color: #e5e5e5; 
            border-color: #bbb;
        }

        /* --- 最後のページ専用：目次へ戻るボタン --- */
        #btn-home {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: none;
            border: none;
            text-decoration: underline;
            font-size: 10px;
            color: #bbb; 
            cursor: pointer;
            font-family: 'Shippori Mincho', serif;
            letter-spacing: 0.1em;
            padding: 5px;
            transition: color 0.3s, transform 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            display: none; 
        }

        #btn-home:active {
            color: #888;
            transform: scale(0.95);
        }

        @media (hover: hover) {
            .btn-action:hover {
                background-color: #fcfcfc;
            }
            #btn-home:hover {
                color: #888;
            }
        }
    </style>
</head>
<body>

    <div id="rain-container"></div>
    <div id="guide">言葉を掬い取る</div>
    <div id="catcher"><div id="caught-text"></div></div>

    <div id="result-layer">
        <div id="result-wrapper">
            <div id="result-container"></div>
        </div>
        <div id="footer-info">
            <div id="button-area">
                <button id="btn-next" class="btn-action" onclick="nextStage()">次へ進む</button>
            </div>
        </div>
        <button id="btn-home" onclick="window.location.href='./index.html'">目次へ戻る</button>
    </div>

    <script>
        const textStages = [
            "雨ニモマケズ風ニモマケズ雪ニモ夏ノ暑サニモマケヌ丈夫ナカラダヲモチ慾ハナク決シテ瞋ラズイツモシヅカニワラッテヰル",
            "一日ニ玄米四合ト味噌ト少シノ野菜ヲタベアラユルコトヲジブンヲカンジョウニ入レズニヨクミキキシワカリソシテワスレズ",
            "野原ノ松ノ林ノ蔭ノ小サナ茅葺キノ小屋ニヰテ東ニ病気ノコドモアレバ行ッテ看病シテヤリ西ニツカレタ母アレバ行ッテソノ稲ノ束ヲ背負ヒ",
            "南ニ死ニサウナ人アレバ行ッテコハガラナクテモイイト言ヒ北ニケンカヤソショウガアレバツマラナイカラヤメロト言ヒヒデリノトキハナミダヲナガシサウイフモノニワタシハナリタイ"
        ];
        
        const rainContainer = document.getElementById('rain-container');
        const catcher = document.getElementById('catcher');
        const caughtTextDisplay = document.getElementById('caught-text');
        const resultLayer = document.getElementById('result-layer');
        const resultContainer = document.getElementById('result-container');
        const footerInfo = document.getElementById('footer-info');
        const guide = document.getElementById('guide');

        let currentStage = 0;
        let charIndex = 0;
        let fallingChars = [];
        let gameActive = false;
        let isFinished = false;
        let caughtIndices = new Set();

        function init() {
            const start = () => { 
                if (!gameActive && !isFinished) { 
                    gameActive = true; 
                    guide.style.opacity = 0; 
                } 
            };

            window.addEventListener('mousemove', (e) => {
                start();
                updateCatcherPos(e.clientX);
            });

            window.addEventListener('touchstart', (e) => { 
                start(); 
                updateCatcherPos(e.touches[0].clientX); 
            }, { passive: false });

            window.addEventListener('touchmove', (e) => { 
                e.preventDefault(); 
                updateCatcherPos(e.touches[0].clientX); 
            }, { passive: false });

            loop();
        }

        function updateCatcherPos(x) {
            let cx = Math.max(50, Math.min(window.innerWidth - 50, x));
            catcher.style.left = cx + 'px';
        }

        function spawnChar() {
            const currentText = textStages[currentStage];
            if (charIndex >= currentText.length) return; 
            const char = currentText[charIndex];
            const el = document.createElement('div');
            el.textContent = char; el.classList.add('rain-char');
            const x = Math.random() * (window.innerWidth - 60) + 30;
            rainContainer.appendChild(el);
            fallingChars.push({ 
                el, char, 
                index: charIndex, 
                x, y: -40, 
                // 変更: 速度の基本値を上げ、ランダム幅も増やしました
                speed: 3.0 + Math.random() * 3.5 
            });
            charIndex++;
        }

        function loop() {
            if (isFinished) return;
            requestAnimationFrame(loop);

            const currentText = textStages[currentStage];
            if (gameActive && charIndex >= currentText.length && fallingChars.length === 0) {
                setTimeout(finishStage, 1000); 
                return;
            }

            if (!gameActive) return;

            if (Math.random() < 0.04) spawnChar();

            const cr = catcher.getBoundingClientRect();
            for (let i = fallingChars.length - 1; i >= 0; i--) {
                const p = fallingChars[i];
                p.y += p.speed;
                p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;

                if (p.y >= cr.top - 15 && p.y <= cr.top + 15 && 
                    p.x >= cr.left - 25 && p.x <= cr.right + 25) {
                    
                    caughtIndices.add(p.index);
                    caughtTextDisplay.textContent = p.char;
                    caughtTextDisplay.classList.add('active');
                    setTimeout(() => caughtTextDisplay.classList.remove('active'), 400);
                    
                    p.el.remove(); 
                    fallingChars.splice(i, 1);
                } else if (p.y > window.innerHeight) {
                    p.el.remove(); 
                    fallingChars.splice(i, 1);
                }
            }
        }

        function finishStage() {
            isFinished = true;
            gameActive = false;

            catcher.style.opacity = '0';
            rainContainer.innerHTML = '';
            
            resultLayer.style.display = 'flex';
            resultContainer.innerHTML = '';
            
            void resultLayer.offsetWidth; 
            resultLayer.style.opacity = '1';
            
            const currentText = textStages[currentStage];
            const interval = 150; 

            for (let i = 0; i < currentText.length; i++) {
                const span = document.createElement('span');
                span.textContent = caughtIndices.has(i) ? currentText[i] : "　";
                span.classList.add('res-char');
                span.style.opacity = '0';
                span.style.visibility = 'hidden';
                
                resultContainer.appendChild(span);
                
                setTimeout(() => {
                    span.style.visibility = 'visible';
                    span.style.opacity = '1';
                }, i * interval);
            }

            if (currentStage === textStages.length - 1) {
                document.getElementById('btn-next').style.display = 'none';
                document.getElementById('btn-home').style.display = 'block';
            } else {
                document.getElementById('btn-next').style.display = 'block';
                document.getElementById('btn-home').style.display = 'none';
            }

            setTimeout(() => {
                footerInfo.style.opacity = '1';
            }, currentText.length * interval + 1000);
        }

        function nextStage() {
            currentStage++;
            charIndex = 0;
            fallingChars = [];
            caughtIndices = new Set();
            isFinished = false;
            gameActive = true; 
            
            resultLayer.style.display = 'none';
            resultLayer.style.opacity = '0';
            footerInfo.style.opacity = '0';
            guide.style.opacity = '0';
            rainContainer.innerHTML = '';
            catcher.style.opacity = '1';
            
            loop();
        }

        init();
    </script>
</body>
</html>
