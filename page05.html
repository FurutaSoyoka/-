<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Breathing Space - Permanent Record</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-top: #4b5563;
            --bg-bottom: #e5e7eb;
            --text-main: #1f2937;
            --accent: #d93a3a;
            --catcher-pos-bottom: 100px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh; 
            overflow: hidden;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 90%);
            color: var(--text-main);
            font-family: 'Shippori Mincho', serif;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
            cursor: ew-resize;
        }

        #rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            --mask-start: calc(100% - var(--catcher-pos-bottom) - 10px);
            --mask-end: calc(100% - 20px);
            mask-image: linear-gradient(to bottom, black var(--mask-start), transparent var(--mask-end));
            -webkit-mask-image: linear-gradient(to bottom, black var(--mask-start), transparent var(--mask-end));
        }

        .rain-char {
            position: absolute;
            font-size: 18px;
            color: #ffffff;
            will-change: top;
        }

        #catcher {
            position: absolute;
            bottom: var(--catcher-pos-bottom);
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            border-bottom: 1px solid var(--text-main);
            border-left: 1px solid var(--text-main);
            border-right: 1px solid var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(2px);
            z-index: 10;
        }

        #caught-text {
            position: absolute;
            top: -40px;
            width: 100%;
            text-align: center;
            font-size: 20px;
            color: var(--text-main);
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #caught-text.active {
            opacity: 1;
        }

        #guide {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            letter-spacing: 0.4em;
            transition: opacity 1s;
        }

        /* 結果表示エリア：ここが永続的に表示されます */
        #result-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: none; /* ゲーム終了時に flex に切り替え */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-bottom);
            padding: 20px;
            box-sizing: border-box;
        }

        #result-container {
            writing-mode: vertical-rl;
            text-orientation: upright;
            max-height: 60dvh; 
            max-width: 90vw;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap; 
            align-content: center; 
            gap: 0.1em 1.2em; 
            font-size: clamp(18px, 5vw, 22px);
            line-height: 1.6;
            overflow-x: auto; 
        }

        /* 文字のフェードイン：1秒かけてじっくり表示 */
        .res-char {
            opacity: 0;
            transition: opacity 1s ease-in-out;
            will-change: opacity;
        }

        .res-space {
            color: transparent;
            display: inline-block;
        }

        #footer-info {
            margin-top: 50px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            /* フッターも文字が出揃う頃に表示 */
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        #end-mark {
            display: inline-block;
            padding: 4px 12px;
            border: 1px solid var(--text-main);
            color: var(--text-main);
            font-size: 11px;
            letter-spacing: 0.2em;
        }

        #btn-back {
            padding: 12px 35px;
            font-size: 12px;
            letter-spacing: 0.1em;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            background: transparent;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Shippori Mincho', serif;
        }

        #btn-back:active {
            background: rgba(0,0,0,0.1);
        }

        #score {
            font-size: 10px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="rain-container"></div>
    <div id="guide">言葉を掬い取る</div>

    <div id="catcher">
        <div id="caught-text"></div>
    </div>

    <div id="result-layer">
        <div id="result-container"></div>
        <div id="footer-info">
            <div id="end-mark">綴り終え</div>
            <div id="score"></div>
            <button id="btn-back" onclick="location.reload()">目次へ戻る</button>
        </div>
    </div>

    <script>
        const textSource = "雨ニモマケズ風ニモマケズ雪ニモ夏ノ暑サニモマケヌ丈夫ナカラダヲモチ慾ハナク決シテ瞋ラズイツモシヅカニワラッテヰル";
        
        const rainContainer = document.getElementById('rain-container');
        const catcher = document.getElementById('catcher');
        const caughtTextDisplay = document.getElementById('caught-text');
        const guide = document.getElementById('guide');
        const resultLayer = document.getElementById('result-layer');
        const resultContainer = document.getElementById('result-container');
        const scoreDisplay = document.getElementById('score');
        const footerInfo = document.getElementById('footer-info');

        let catcherX = window.innerWidth / 2;
        let charIndex = 0;
        let fallingChars = [];
        let gameActive = false;
        let isFinished = false;
        let caughtIndices = new Set();

        const BASE_SPEED_MIN = 1.6;
        const BASE_SPEED_MAX = 4.8;
        const SPAWN_RATE = 50; 
        let frameCount = 0;

        function init() {
            window.addEventListener('mousemove', (e) => handleMove(e.clientX));
            window.addEventListener('touchmove', (e) => {
                e.preventDefault();
                handleMove(e.touches[0].clientX);
            }, { passive: false });
            window.addEventListener('touchstart', (e) => {
                if (!gameActive && !isFinished) startGame();
                handleMove(e.touches[0].clientX);
            }, { passive: false });

            updateCatcherPos(window.innerWidth / 2);
            loop();
        }

        function handleMove(x) {
            updateCatcherPos(x);
            if (!gameActive && !isFinished) startGame();
        }

        function startGame() {
            gameActive = true;
            guide.style.opacity = 0;
        }

        function updateCatcherPos(x) {
            catcherX = x;
            const limit = catcher.offsetWidth / 2;
            if (catcherX < limit) catcherX = limit;
            if (catcherX > window.innerWidth - limit) catcherX = window.innerWidth - limit;
            catcher.style.left = catcherX + 'px';
        }

        function spawnChar() {
            if (charIndex >= textSource.length) return; 

            const index = charIndex;
            const char = textSource[charIndex];
            charIndex++;

            const el = document.createElement('div');
            el.textContent = char;
            el.classList.add('rain-char');
            
            const x = Math.random() * (window.innerWidth - 60) + 30;
            const y = -30 - Math.random() * 70;

            rainContainer.appendChild(el);

            fallingChars.push({
                el: el,
                char: char,
                index: index,
                x: x,
                y: y,
                speed: BASE_SPEED_MIN + Math.random() * (BASE_SPEED_MAX - BASE_SPEED_MIN),
                isCaught: false
            });
        }

        function loop() {
            if (isFinished) return;
            requestAnimationFrame(loop);

            if (gameActive && charIndex >= textSource.length && fallingChars.length === 0) {
                setTimeout(finishGame, 800);
                return;
            }

            if (!gameActive) return;

            frameCount++;
            if (frameCount % SPAWN_RATE === 0) spawnChar();

            const catcherRect = catcher.getBoundingClientRect();
            
            for (let i = fallingChars.length - 1; i >= 0; i--) {
                const p = fallingChars[i];
                p.y += p.speed;
                p.el.style.top = p.y + 'px';
                p.el.style.left = p.x + 'px';

                if (!p.isCaught && p.y >= catcherRect.top && p.y <= catcherRect.bottom) {
                    if (p.x >= catcherRect.left && p.x <= catcherRect.right) {
                        catchChar(p, i);
                        continue;
                    }
                }

                if (p.y > window.innerHeight + 100) {
                    p.el.remove();
                    fallingChars.splice(i, 1);
                }
            }
        }

        function catchChar(p, index) {
            p.isCaught = true;
            p.el.remove();
            fallingChars.splice(index, 1);
            caughtIndices.add(p.index);

            caughtTextDisplay.textContent = p.char;
            caughtTextDisplay.classList.remove('active');
            void caughtTextDisplay.offsetWidth; 
            caughtTextDisplay.classList.add('active');

            catcher.style.background = "rgba(255, 255, 255, 0.2)";
            setTimeout(() => {
                catcher.style.background = "rgba(255, 255, 255, 0.05)";
            }, 100);
        }

        function finishGame() {
            isFinished = true;
            resultLayer.style.display = 'flex';
            
            for (let i = 0; i < textSource.length; i++) {
                const span = document.createElement('span');
                
                if (caughtIndices.has(i)) {
                    span.textContent = textSource[i];
                    span.classList.add('res-char');
                } else {
                    span.textContent = "　"; 
                    span.classList.add('res-char', 'res-space');
                }
                
                resultContainer.appendChild(span);
                
                // 少しゆっくりめに表示を開始
                setTimeout(() => {
                    span.style.opacity = '1';
                }, i * 80);
            }

            // スコア表示
            scoreDisplay.textContent = `${caughtIndices.size} / ${textSource.length} 文字を収集`;

            // 文字が全て出揃う頃にフッター（ボタン）をふわっと出す
            setTimeout(() => {
                footerInfo.style.opacity = '1';
            }, textSource.length * 80 + 500);
        }

        init();
    </script>
</body>
</html>
