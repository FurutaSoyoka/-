<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>触れる読書 - Active Reading</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #e0e0e0;
            --accent-gray: #888;
            --text-main: #1a1a1a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Shippori Mincho', serif;
            writing-mode: horizontal-tb;
            
            overflow-x: hidden; 
            overflow-y: auto;
            
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
            
            /* モバイルでの反応を速める */
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent; 
        }

        /* 背景のテクスチャ */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        #wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column; 
            align-items: center;
        }

        header {
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 0.8em;
            border-left: none;
            padding-left: 0;
            font-weight: 600;
            line-height: 1;
            text-align: center;
            margin: 0;
        }

        #menu-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .project-link {
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: inherit;
            scroll-snap-align: center;
            scroll-snap-stop: always;
            position: relative;
        }

        .project-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            padding: 0 20px;
            text-align: center;
            
            transition: 
                opacity 1s cubic-bezier(0.19, 1, 0.22, 1),
                filter 1s cubic-bezier(0.19, 1, 0.22, 1),
                transform 1s cubic-bezier(0.19, 1, 0.22, 1);
            
            /* 初期状態：モザイク（ぼかし3px） */
            opacity: 0.6;
            filter: blur(3px);
            transform: translateY(10px) scale(0.99);
        }

        /* アクティブ（1タップ目）にモザイク解除 */
        .project-link.is-active .project-content {
            opacity: 1;
            filter: blur(0);
            transform: translateY(0) scale(1);
        }

        .number {
            font-size: 14px;
            color: var(--accent-gray);
            font-family: "Times New Roman", serif;
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            position: relative;
        }

        .number::after {
            content: "";
            position: absolute;
            bottom: -1.5rem;
            left: 50%;
            width: 1px;
            height: 1rem;
            background-color: var(--border-color);
        }

        .project-title {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 0.3em;
            margin: 1rem 0 1.5rem 0;
            line-height: 1.5;
        }

        .project-desc {
            font-size: 14px;
            color: #555;
            line-height: 2.2;
            letter-spacing: 0.05em;
            font-weight: 400;
            max-width: 34em;
            word-break: keep-all;
        }

        @media (max-width: 768px) {
            h1 { font-size: 24px; letter-spacing: 0.6em; }
            .project-title { font-size: 22px; }
            .project-desc { font-size: 13px; max-width: 24em; }
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <header>
            <h1>触れる読書</h1>
        </header>

        <nav id="menu-list">
            <a href="page01.html" class="project-link">
                <div class="project-content">
                    <div class="number">01</div>
                    <h2 class="project-title">彷徨う文脈</h2>
                    <p class="project-desc">散在する文字を物理的に集め<br>意味を構築する読み</p>
                </div>
            </a>

            <a href="page02.html" class="project-link">
                <div class="project-content">
                    <div class="number">02</div>
                    <h2 class="project-title">呼吸する余白</h2>
                    <p class="project-desc">凝縮された黒塊から可読性のある間隙を<br>探り当て保持する読み</p>
                </div>
            </a>

            <a href="page03.html" class="project-link">
                <div class="project-content">
                    <div class="number">03</div>
                    <h2 class="project-title">揮発する記憶</h2>
                    <p class="project-desc">無の表層を擦過し続け<br>忘却に抗う読み</p>
                </div>
            </a>

            <a href="page04.html" class="project-link">
                <div class="project-content">
                    <div class="number">04</div>
                    <h2 class="project-title">抗うスクロール</h2>
                    <p class="project-desc">過剰な摩擦を指先で推し進め<br>一文ずつ踏みしめる読み</p>
                </div>
            </a>

            <a href="page05.html" class="project-link">
                <div class="project-content">
                    <div class="number">05</div>
                    <h2 class="project-title">降り注ぐ言葉</h2>
                    <p class="project-desc">零れ落ちる言葉を自らの器で受け止め<br>意味を救い出す読み</p>
                </div>
            </a>
        </nav>
    </div>

    <script>
        const links = document.querySelectorAll('.project-link');

        links.forEach(link => {
            link.addEventListener('click', function(e) {
                // すでにアクティブ（モザイク解除済み）でない場合
                if (!this.classList.contains('is-active')) {
                    // 1回目のタップ：遷移を止めて、モザイクを消す
                    e.preventDefault();
                    
                    // 他の項目のアクティブ状態を解除
                    links.forEach(l => l.classList.remove('is-active'));
                    
                    // 自分をアクティブ化
                    this.classList.add('is-active');
                    
                    // 中央へスムーズにスクロールさせる（スナップを補助）
                    this.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                // すでにアクティブな場合は、2回目のタップとしてそのまま遷移する
            });
        });

        // スクロールで画面外に出たらモザイク状態に戻すリセット機能
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) {
                    entry.target.classList.remove('is-active');
                }
            });
        }, { 
            threshold: 0.1 
        });

        links.forEach(link => observer.observe(link));
    </script>

</body>
</html>
