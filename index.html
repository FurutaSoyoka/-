<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>触れる読書 - Active Reading</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fafafa;
            --border-color: #e0e0e0;
            --accent-gray: #888;
            --text-main: #1a1a1a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Shippori Mincho', serif;
            writing-mode: horizontal-tb;
            
            overflow-x: hidden; 
            overflow-y: auto;
            
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
            
            /* Disable double-tap zoom delay for faster clicks */
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent; 
        }

        /* Background texture */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        #wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column; 
            align-items: center;
        }

        header {
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 0.8em;
            font-weight: 600;
            line-height: 1;
            text-align: center;
            margin: 0;
        }

        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--accent-gray);
            font-size: 10px;
            letter-spacing: 0.3em;
            pointer-events: none;
        }

        .scroll-hint span {
            text-transform: uppercase;
            font-family: "Times New Roman", serif;
        }

        .scroll-hint .arrow {
            font-size: 14px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
            40% { transform: translateY(10px); opacity: 1; }
            60% { transform: translateY(5px); opacity: 0.8; }
        }

        #menu-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .project-section {
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
            scroll-snap-stop: always;
            position: relative;
        }

        /* Hit area focused on text block */
        .project-link {
            display: inline-block;
            text-decoration: none;
            color: inherit;
            padding: 30px 20px; /* Reduced padding for more focused hit area */
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .project-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            text-align: center;
            pointer-events: none;
            
            /* Snappier transition speed (0.3s) */
            transition: 
                opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                filter 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            
            /* Initial state: 3px blur */
            opacity: 0.7;
            filter: blur(3px);
            transform: translateY(5px) scale(1);
        }

        /* Focus state: clear mosaic */
        .project-link.is-active .project-content {
            opacity: 1;
            filter: blur(0);
            transform: translateY(0) scale(1.02);
        }

        .number {
            font-size: 14px;
            color: var(--accent-gray);
            font-family: "Times New Roman", serif;
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            position: relative;
        }

        .number::after {
            content: "";
            position: absolute;
            bottom: -1.5rem;
            left: 50%;
            width: 1px;
            height: 1rem;
            background-color: var(--border-color);
        }

        .project-title {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 0.3em;
            margin: 1rem 0 1.5rem 0;
            line-height: 1.5;
        }

        .project-desc {
            font-size: 14px;
            color: #555;
            line-height: 2.2;
            letter-spacing: 0.05em;
            font-weight: 400;
            max-width: 34em;
            word-break: keep-all;
        }

        @media (max-width: 768px) {
            h1 { font-size: 24px; letter-spacing: 0.6em; }
            .project-link { padding: 25px 15px; }
            .project-title { font-size: 22px; }
            .project-desc { font-size: 13px; max-width: 24em; }
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <header>
            <h1>触れる読書</h1>
            <div class="scroll-hint">
                <span>scroll</span>
                <div class="arrow">↓</div>
            </div>
        </header>

        <nav id="menu-list">
            <section class="project-section">
                <a href="page01.html" class="project-link">
                    <div class="project-content">
                        <div class="number">01</div>
                        <h2 class="project-title">彷徨う文脈</h2>
                        <p class="project-desc">散在する文字を物理的に集め<br>意味を構築する読み</p>
                    </div>
                </a>
            </section>

            <section class="project-section">
                <a href="page02.html" class="project-link">
                    <div class="project-content">
                        <div class="number">02</div>
                        <h2 class="project-title">呼吸する余白</h2>
                        <p class="project-desc">凝縮された黒塊から可読性のある間隙を<br>探り当て保持する読み</p>
                    </div>
                </a>
            </section>

            <section class="project-section">
                <a href="page03.html" class="project-link">
                    <div class="project-content">
                        <div class="number">03</div>
                        <h2 class="project-title">揮発する記憶</h2>
                        <p class="project-desc">無の表層を擦過し続け<br>忘却に抗う読み</p>
                    </div>
                </a>
            </section>

            <section class="project-section">
                <a href="page04.html" class="project-link">
                    <div class="project-content">
                        <div class="number">04</div>
                        <h2 class="project-title">抗うスクロール</h2>
                        <p class="project-desc">過剰な摩擦を指先で推し進め<br>一文ずつ踏みしめる読み</p>
                    </div>
                </a>
            </section>

            <section class="project-section">
                <a href="page05.html" class="project-link">
                    <div class="project-content">
                        <div class="number">05</div>
                        <h2 class="project-title">降り注ぐ言葉</h2>
                        <p class="project-desc">零れ落ちる言葉を自らの器で受け止め<br>意味を救い出す読み</p>
                    </div>
                </a>
            </section>
        </nav>
    </div>

    <script>
        const links = document.querySelectorAll('.project-link');
        const sections = document.querySelectorAll('.project-section');

        links.forEach(link => {
            link.addEventListener('click', function(e) {
                if (!this.classList.contains('is-active')) {
                    // 1st Tap: Clear mosaic
                    e.preventDefault();
                    
                    links.forEach(l => l.classList.remove('is-active'));
                    this.classList.add('is-active');
                    
                    // Center the item
                    this.parentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                // 2nd Tap: Navigate
            });
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) {
                    const link = entry.target.querySelector('.project-link');
                    if (link) link.classList.remove('is-active');
                }
            });
        }, { 
            threshold: 0.1 
        });

        sections.forEach(section => observer.observe(section));
    </script>

</body>
</html>
